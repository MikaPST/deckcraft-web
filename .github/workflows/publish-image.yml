name: Build and publish DeckCraft Web

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    paths:
      - "README.md"
      - "docker-compose.yml"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deckcraft-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Checkout upstream DeckCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: main
          path: upstream

      - name: Checkout optional craft-fonts assets
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build DeckCraft Web
        working-directory: upstream/apps/deckcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: Verify web build output
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/dist/web/index.html
          find upstream/dist/web -maxdepth 1 -type f \( -name 'deckcraft-web-*.js' -o -name 'deckcraft-web-*.wasm' \) | grep -q .
          echo "DeckCraft Web build output verified."

      - name: Prepare NGINX image context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-context/site
          cp -a upstream/dist/web/. image-context/site/
          cat > image-context/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY site/ /usr/share/nginx/html/
          EXPOSE 8080
          EOF
          cat > image-context/nginx.conf <<'EOF'
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types application/javascript application/wasm application/json text/css text/plain image/svg+xml;

              location = /index.html {
                  add_header Cache-Control "no-cache, no-store, must-revalidate";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.[a-f0-9]+\.(js|wasm|css)$ {
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }
          }
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ github.sha }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
